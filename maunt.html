<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BDJ Kiosk</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.10/build/css/intlTelInput.css">
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.10/build/js/intlTelInput.min.js"></script>

    <style>
        body { background-color: #2497d0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        .slanted-bg {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40vh;
            background-color: #ffffff; clip-path: polygon(0 15%, 100% 0, 100% 100%, 0% 100%); z-index: 1;
        }
        .maunt-input, .iti { width: 100%; }
        .maunt-input {
            background: #1E1E1E; border: 2px solid #333; color: white; transition: all 0.3s;
        }
        .maunt-input:focus { outline: none; border-color: #ffffff; background: #2a2a2a; transform: translateY(-2px); }
        
        /* Poprawka koloru dla listy krajów */
        .iti__country-list { color: #000; }
        .fade-view { transition: opacity 0.5s ease, transform 0.5s ease; }
        .hidden-view { opacity: 0; transform: translateY(30px); pointer-events: none; display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="slanted-bg"></div>

    <main id="form-view" class="w-full max-w-4xl relative z-10 fade-view">
        <div class="bg-[#2497d0] p-8 md:p-12 shadow-2xl border-t-8 border-white">
            
            <div class="flex flex-col items-center justify-center mb-8 text-center">
                <img src="https://bluedragonjet.com/wp-content/uploads/2026/03/bdj-logo-white.pdf" alt="BDJ" class="h-48 md:h-80 object-contain">
            </div>

            <h2 class="text-white text-center text-xl md:text-2xl font-black uppercase tracking-widest mb-10">
                Hinterlassen Sie Ihre Daten / Leave your details
            </h2>

            <form id="lead-form" class="space-y-6">
                <input type="hidden" name="access_key" value="f2fd5407-163e-4d73-ad00-380225767137">
                
                <div>
                    <label class="block text-white text-xs font-bold uppercase mb-2">Name</label>
                    <input type="text" name="name" required class="maunt-input w-full p-4 md:p-6 text-xl font-bold">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-white text-xs font-bold uppercase mb-2">Firma / Company</label>
                        <input type="text" name="company" required class="maunt-input w-full p-4 md:p-6 text-xl font-bold">
                    </div>
                    <div>
                        <label class="block text-white text-xs font-bold uppercase mb-2">USt-IDNr. / VAT ID (NIP)</label>
                        <input type="text" name="vatid" class="maunt-input w-full p-4 md:p-6 text-xl font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-white text-xs font-bold uppercase mb-2">Email</label>
                        <input type="email" name="email" required class="maunt-input w-full p-4 md:p-6 text-xl font-bold">
                    </div>
                    <div>
                        <label class="block text-white text-xs font-bold uppercase mb-2">Telefon / Phone</label>
                        <input type="tel" id="phone" name="phone_full" required class="maunt-input w-full p-4 md:p-6 text-xl font-bold">
                    </div>
                </div>

                <div class="flex items-start gap-4 py-4">
                    <input type="checkbox" name="gdpr" required class="w-8 h-8 shrink-0 cursor-pointer">
                    <label class="text-white text-sm cursor-pointer select-none">
                        Ich bin einverstanden / I agree to the processing of data.
                    </label>
                </div>

                <button type="submit" id="btn" class="w-full bg-white text-[#2497d0] p-6 md:p-8 text-2xl font-black uppercase hover:bg-gray-100 transition-all active:scale-95">
                    SENDEN / SUBMIT
                </button>
            </form>
        </div>
    </main>

    <section id="success-view" class="hidden-view fixed inset-0 flex flex-col items-center justify-center bg-[#2497d0] z-50 text-center px-4">
        <div class="w-32 h-32 border-8 border-white rounded-full flex items-center justify-center mb-8">
            <span class="text-white text-6xl">✓</span>
        </div>
        <h2 class="text-white text-5xl font-black uppercase mb-4">Vielen Dank!</h2>
        <h3 class="text-white text-2xl font-bold uppercase opacity-80">Thank you</h3>
    </section>

    <script>
        // Inicjalizacja wyboru kraju
        const phoneInput = document.querySelector("#phone");
        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "pl",
            separateDialCode: true,
            preferredCountries: ["pl", "de", "gb", "us"],
            utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.10/build/js/utils.js",
        });

        const form = document.getElementById('lead-form');
        const btn = document.getElementById('btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "SENDING...";

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            
            // Pobieramy pełny numer z kodem kraju
            object.phone = iti.getNumber();

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(object)
                });

                if (response.ok) {
                    document.getElementById('form-view').classList.add('hidden-view');
                    document.getElementById('success-view').style.display = 'flex';
                    setTimeout(() => {
                        document.getElementById('success-view').classList.remove('hidden-view');
                        document.getElementById('success-view').style.opacity = '1';
                    }, 10);
                    
                    setTimeout(() => location.reload(), 5000);
                } else {
                    alert("Error! Please try again.");
                    btn.disabled = false;
                    btn.innerText = "SENDEN / SUBMIT";
                }
            } catch (err) {
                alert("Connection error.");
                btn.disabled = false;
                btn.innerText = "SENDEN / SUBMIT";
            }
        });
    </script>
</body>
</html>
